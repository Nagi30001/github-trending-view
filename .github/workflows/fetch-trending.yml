name: Fetch GitHub Trending and Deploy

on:
  schedule:
    # 每天 UTC 0:00, 8:00, 16:00 运行（北京时间 8:00, 16:00, 0:00）
    - cron: '0 */8 * * *'
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史，用于计算排名变化

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch trending data
        run: node scripts/fetch-trending.js

      - name: Generate static data
        run: node scripts/generate-static-data.js

      - name: Commit and push data changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git add public/
          git diff --staged --quiet || git commit -m "📊 Update trending data [skip ci]"
          git push

      - name: Trigger static workflow
        if: success()
        run: |
          gh api -X POST /repos/${{ github.repository }}/dispatches \
            -f event_type=deploy_static
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GHStars
        if: success()
        env:
          GHSTARS_UPLOAD_URL: ${{ secrets.GHSTARS_UPLOAD_URL }}
          GHSTARS_UPLOAD_TOKEN: ${{ secrets.GHSTARS_UPLOAD_TOKEN }}
        run: |
          if [ -z "$GHSTARS_UPLOAD_URL" ] || [ -z "$GHSTARS_UPLOAD_TOKEN" ]; then
            echo "GHSTARS secrets 未配置，跳过上传（首次接入请配置 repo secrets 后重跑）"
            exit 0
          fi
          TODAY=$(date -u +%F) # 与 fetch-trending.js 的 UTC 日期目录一致
          for period in daily weekly monthly; do
            file="data/$TODAY/$period.json"
            [ -f "$file" ] || { echo "缺少 $file"; exit 1; }
            resp=$(curl -sS --max-time 60 -X POST "$GHSTARS_UPLOAD_URL/biz/c/tenant/ghstars/trending/upload" \
              -H "Authorization: Bearer $GHSTARS_UPLOAD_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @"$file") || { echo "网络失败 [$period]"; exit 1; }
            echo "$resp" | grep -q '"code":200,' || { echo "上传失败 [$period]: $resp"; exit 1; }
            echo "已上传 $period"
          done
